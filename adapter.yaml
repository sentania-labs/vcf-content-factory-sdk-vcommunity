name: "VCF Content Factory vCommunity"
version: "1.0.0"
build_number: 3
adapter_kind: "vcfcf_vcommunity"
entry_class: "com.vcfcf.adapters.vcommunity.VCommunityAdapter"
tier: 2
released: false
description: >
  Native Java SDK rewrite of the Python Integration SDK management pack
  vmbro/VCF-Operations-vCommunity (Onur Yuzseven, CC-licensed). Kills the
  Docker-on-Cloud-Proxy runtime; runs natively in the collector. Reads vCenter
  via vim25 SOAP and pushes the vCommunity| property/metric namespace onto
  existing VMWARE ClusterComputeResource / HostSystem / VirtualMachine
  resources via ARIA_OPS-style Suite API stitching — cluster HA/DRS/EVC, host
  advanced settings / VIB packages / install date / licensing / NIC uplinks, VM
  config / extra-config / SCSI controllers / snapshot count, and (opt-in)
  Windows guest-ops (services, OS info, event logs) via the vim25
  GuestOperationsManager. Side-by-side fork of the original (adapter kind
  vcfcf_vcommunity); see README for the migration runbook. Attribution: Onur
  Yuzseven / vmbro/VCF-Operations-vCommunity.
